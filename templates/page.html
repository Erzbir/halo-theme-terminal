<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
<th:block th:fragment="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">Page title</title>
</th:block>
<th:block th:fragment="content">
    <article class="post">
        <header>
            <h1 class="post-title" th:text="${singlePage.spec.title}">Post Title</h1>
        </header>
        <div class="post-content">
            <div th:utext="${singlePage.content.content}" class="post-body">Post Content</div>
        </div>
    </article>
    <th:block
            th:replace="~{modules/comment :: comment(group = 'content.halo.run', kind = 'SinglePage', name = ${singlePage.metadata.name})}"
            />
</th:block>
</html>
