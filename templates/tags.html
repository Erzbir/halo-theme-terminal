<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
<th:block th:fragment="head">
    <title th:text="|#{page.tags.title} - ${site.title}|">Tags</title>
</th:block>
<th:block th:fragment="content">
    <article class="post">
        <header>
            <h1 class="post-title"
                th:with="title=${theme.config.tags_page.title_s ?: #messages.msg('page.tags.title')}"
                th:text="${title}">
                Tags
            </h1>
        </header>
        <div class="post-content">
            <ul>
                <li th:each="tag: ${tags}">
                    <a data-pjax th:href="@{${tag.status.permalink}}"
                       th:text="${tag.spec.displayName}">
                    </a>
                    <span th:text="' ['+${tag.status.visiblePostCount?:0}+']'"></span>
                </li>
            </ul>
        </div>
    </article>
</th:block>
</html>
