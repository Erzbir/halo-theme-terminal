<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
<th:block th:fragment="head">
    <title th:text="|#{page.categories.title} - ${site.title}|">Categories</title>
</th:block>
<th:block th:fragment="content">
    <article class="post">
        <header>
            <h1 class="post-title"
                th:with="title=${theme.config.categories_page.title_s ?: #messages.msg('page.categories.title')}"
                th:text="${title}">
                Categories
            </h1>
        </header>
        <div class="post-content">
            <ul>
                <li th:replace="~{modules/category-tree :: single(categories=${categories})}"></li>
            </ul>
        </div>
    </article>
</th:block>
</html>
