<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
<th:block th:fragment="head">
    <title th:text="|#{page.category.title}: ${category.spec.displayName} - ${site.title}|">Category</title>
</th:block>
<th:block th:fragment="content">
    <article class="post">
        <header>
            <h1 class="post-title"
                th:with="title=${theme.config.categories_page.title ?: #messages.msg('page.category.title')}"
                th:text="|${title}: ${category.spec.displayName} [${category.status.visiblePostCount ?: 0}]|">
                Category: Category name [n]
            </h1>
        </header>
        <div class="post-content">
            <ul>
                <li class="post-list" th:each="post : ${posts.items}">
                    <a data-pjax th:href="@{${post.status.permalink}}">
                        <span th:text="${#dates.format(post.spec.publishTime,'yyyy-MM-dd')}">Publish Time</span>
                        <span>&nbsp;::&nbsp;</span>
                        <span class="post-list-title" th:text="${post.spec.title}">Post Title</span>
                    </a>
                </li>
            </ul>
        </div>
    </article>
    <th:block th:replace="~{modules/pagination :: page(
        hasPrevious=${posts.hasPrevious()},
        previousUrl=@{${posts.prevUrl}},
        hasNext=${posts.hasNext()},
        nextUrl=@{${posts.nextUrl}},
        previousClass=''
    )}"/>
</th:block>
</html>
