<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}"
>
<th:block th:fragment="head">
    <title th:text="|${post.spec.title} - ${site.title}|">Post title</title>
</th:block>
<th:block th:fragment="content">
    <article class="post">
        <header>
            <h1 class="post-title" th:text="${post.spec.title}">Post Title</h1>
            <div class="post-meta">
                <time class="post-time"
                      th:text="${#dates.format(post.spec.publishTime, '__${theme.config.general.time_style == 'custom' ?
                                theme.config.general.custom_time_style : theme.config.general.time_style}__')}">Publish Time
                </time>
                <span class="post-author" th:text="${post.owner.displayName}">Author</span><th:block th:replace="~{modules/tag-list(post = ${post}, show = ${theme.config.post_page.show_tags})}"/>
            </div>
        </header>
        <section class="post-content">
            <div th:utext="${post.content.content}" id="content" class="post-body">Post Content</div>
        </section>
    </article>
    <nav id="toc" th:if="${theme.config.post_page.show_toc}" class="toc"
         th:with="tocDefaultOpen=${theme.config.post_page.toc_default_open ?: 'auto'}"
         th:attr="data-default-open=${tocDefaultOpen == 'open' ? 'true' : (tocDefaultOpen == 'closed' ? 'false' : (theme.config.layout.fullscreen_layout ? 'false' : 'true'))}">
        <button id="toc-toggle" class="toc-toggle" th:attr="aria-label=#{toc.hide}"></button>
        <div id="toc-content" class="toc-content"></div>
    </nav>
    <th:block th:replace="~{modules/pagination :: post(
        cursor=${postFinder.cursor(post.metadata?.name)}
    )}"/>
    <th:block
            th:replace="~{modules/comment :: comment(group = 'content.halo.run', kind = 'Post', name = ${post.metadata.name})}"
            th:if="${haloCommentEnabled}"/>
</th:block>
</html>
