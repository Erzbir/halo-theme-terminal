apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-terminal-ez-setting
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: text
          label: logo
          name: logo
          value:
          help: 设置左上角 logo 文本, 不设置默认为 halo 中设置的站点标题
        - $formkit: checkbox
          name: pjax_enable
          label: 启用 PJAX
          help: 默认关闭, 开启后点击站内链接时只更新主要内容区域而不是整个页面 (可能与一些插件存在兼容问题)
          value: false
    - group: style
      label: 全局样式
      formSchema:
        - $formkit: select
          label: 默认字体
          name: default_font
          value: "JetBrains Mono"
          options:
            - label: "JetBrains Mono"
              value: "JetBrains Mono"
            - label: "Hack"
              value: "Hack"

        - $formkit: checkbox
          label: 启用全屏布局
          name: fullscreen_layout
          value: false
          help: 开启后让正文区域占满可用宽度

        - $formkit: checkbox
          label: 表格宽度铺满父元素
          name: table_full_width
          value: false
          help: 开启后文章内容中的 table 会占满正文内容区域宽度

        - $formkit: checkbox
          name: pixel_style
          label: 默认像素化风格
          value: false
          help: 开启后将默认使用像素风格字体及图标
          
        - $formkit: checkbox
          label: 使用系统字体
          name: system_font_enable
          id: system_font_enable
          value: false
          help: 开启后将优先使用访问者的系统字体

        - $formkit: checkbox
          if: "$get(system_font_enable).value != true"
          name: custom_font_enable
          id: custom_font_enable
          label: 启用自定义字体文件
          value: false
          help: '如果启用 "使用系统字体", 此配置项不生效'             
        
        - $formkit: attachment
          if: "$get(custom_font_enable).value === true"
          name: custom_font_file
          label: 自定义字体文件
          value: ""
          
        - $formkit: text
          if: "$get(custom_font_enable).value === true"
          name: custom_font_name
          label: 字体名称
          help: 填写字体文件中声明的字体全名或 PostScript 名, 名称不正确时无法加载字体
          value: ""
        
        - $formkit: checkbox
          name: color_scheme_switcher_enable
          label: 启用访客配色切换
          value: false
          help: 开启后在页头显示配色选择下拉框
          
        - $formkit: select
          name: default_scheme_mode
          label: 默认配色方案
          value: "dark"
          help: 控制访客首次访问时使用的配色模式
          options:
            - label: "深色"
              value: "dark"
            - label: "浅色"
              value: "light"
            - label: "跟随系统"
              value: "system"
        - $formkit: select
          name: dark_color_scheme
          id: dark_color_scheme
          label: 深色配色方案
          value: "night"
          help: 控制深色模式使用的配色方案
          options:
            - label: "custom"
              value: "custom"
            - label: "day"
              value: "day"
            - label: "night"
              value: "night"
            - label: "blood"
              value: "blood"
            - label: "niello"
              value: "niello"
            - label: "matrix"
              value: "matrix"
            - label: "ink"
              value: "ink"
            - label: "paper"
              value: "paper"
            - label: "hopbush"
              value: "hopbush"
            - label: "pistachio"
              value: "pistachio"
            - label: "blue"
              value: "blue"
            - label: "studio"
              value: "studio"
            - label: "vanilla"
              value: "vanilla"
        - $formkit: select
          name: light_color_scheme
          id: light_color_scheme
          label: 浅色配色方案
          value: "day"
          help: 控制浅色模式使用的配色方案
          options:
            - label: "custom"
              value: "custom"
            - label: "day"
              value: "day"
            - label: "night"
              value: "night"
            - label: "blood"
              value: "blood"
            - label: "niello"
              value: "niello"
            - label: "matrix"
              value: "matrix"
            - label: "ink"
              value: "ink"
            - label: "paper"
              value: "paper"
            - label: "hopbush"
              value: "hopbush"
            - label: "pistachio"
              value: "pistachio"
            - label: "blue"
              value: "blue"
            - label: "studio"
              value: "studio"
            - label: "vanilla"
              value: "vanilla"
        - $formkit: select
          label: 无序列表标记
          name: list_marker
          value: ""
          help: 控制文章中无序列表项前的标记
          options:
            - label: "default"
              value: ""
            - label: "-"
              value: '"-"'
            - label: "*"
              value: '"*"'
            - label: "+"
              value: '"+"'
            - label: ">"
              value: '">"'

        - $formkit: select
          label: 边线样式
          name: border_style
          value: ""
          help: 控制主题通用边线样式
          options:
            - label: "default"
              value: ""
            - label: "solid"
              value: "solid"
            - label: "dashed"
              value: "dashed"
            - label: "dotted"
              value: "dotted"
            - label: "double"
              value: "double"
            - label: "none"
              value: "none"

        - $formkit: select
          label: 表格边线样式
          name: table_border_style
          value: ""
          help: 控制表格边线样式
          options:
            - label: "default"
              value: ""
            - label: "solid"
              value: "solid"
            - label: "dashed"
              value: "dashed"
            - label: "dotted"
              value: "dotted"
            - label: "double"
              value: "double"
            - label: "none"
              value: "none"

        - $formkit: select
          label: 标题分隔线样式
          name: title_divider_style
          value: ""
          help: 控制文章标题分隔线样式
          options:
            - label: "default"
              value: ""
            - label: "solid"
              value: "solid"
            - label: "dashed"
              value: "dashed"
            - label: "dotted"
              value: "dotted"
            - label: "double"
              value: "double"
            - label: "none"
              value: "none"

        - $formkit: select
          name: time_style
          id: time_style
          label: 时间格式
          value: "yyyy-MM-dd"
          help: 控制文章发布时间的显示格式
          options:
            - label: "yyyy-MM-ddTHH:mm:ssXXX"
              value: "yyyy-MM-dd''T''HH:mm:ssXXX"
            - label: "yyyy-MM-dd HH:mm:ss"
              value: "yyyy-MM-dd'' ''HH:mm:ss"
            - label: "yyyy-MM-dd"
              value: "yyyy-MM-dd"
            - label: "custom"
              value: "custom"

        - $formkit: text
          if: "$get(time_style).value === 'custom'"
          name: custom_time_style
          label: 自定义时间格式
          placeholder: "yyyy-MM-dd"
          validation: "required"

        - $formkit: number
          name: prefer_ttl
          label: 访客偏好有效期 (小时)
          value: 24
          min: 0
          help: 访客手动选择的模式, 配色和像素风格过期后会在下次访问时恢复默认值, 设为 0 表示永久保存

        - $formkit: text
          name: custom_dark
          if: "$get(dark_color_scheme).value === 'custom'"
          value: ""
          help: 填写自定义深色配色方案的名称
          validation: "required"

        - $formkit: text
          name: custom_light
          if: "$get(light_color_scheme).value === 'custom'"
          value: ""
          help: 填写自定义浅色配色方案的名称
          validation: "required"

        - $formkit: text
          label: 正文区域最大宽度
          name: max_width
          value:
          help: 控制正文区域最大宽度, 例如 960px / 80vw

        - $formkit: text
          label: 正文区域内边距
          name: content_padding
          value:
          placeholder: "calc(var(--size-theme-font) * 2.5)"
          help: 控制正文容器内边距, 例如 2rem / 24px / calc(var(--size-theme-font) * 2)

        - $formkit: text
          label: 正文媒体最大宽度
          name: media_max_width
          value:
          placeholder: "60%"
          help: 控制文章内容中图片 / 视频 / figure 的最大宽度

        - $formkit: text
          label: 基础字体大小
          name: font_size
          value:
          placeholder: "1rem"
          help: 控制全站基础字体大小, 例如 16px / 1rem / 18px

        - $formkit: text
          label: 基础行高
          name: line_height
          value:
          placeholder: "calc(var(--size-theme-font) * 1.8)"
          help: 控制全站基础行高, 例如 1.8 / 28px / calc(var(--size-theme-font) * 1.8)

        - $formkit: text
          label: 文章段落间距
          name: post_paragraph_spacing
          value:
          placeholder: "calc(var(--size-theme-font) * 1.5625)"
          help: 控制文章正文段落的上下间距, 例如 1.5rem / 24px / calc(var(--size-theme-font) * 1.5)

        - $formkit: text
          label: 文章元信息分隔符
          name: post_meta_divider
          value:
          placeholder: "::"
          help: "控制文章元信息之间的分隔符, 例如 ::, |, ·"

        - $formkit: text
          label: 边线宽度
          name: border_width
          value:
          placeholder: "calc(var(--size-theme-font) * 0.125)"
          help: 控制主题通用边线宽度

        - $formkit: text
          label: 表格边线宽度
          name: table_border_width
          value:
          placeholder: "calc(var(--size-theme-font) * 0.0625)"
          help: 控制表格边线宽度

        - $formkit: code
          name: custom
          label: 自定义样式
          language: css
          height: 150px
          value: ""
          help: 填写自定义 CSS, 内容会覆盖主题默认样式
    - group: index_page
      label: 首页
      formSchema:
        - $formkit: text
          name: notice_title
          label: 公告标题
          value: "Hello Terminal!"
        - $formkit: textarea
          name: notice_content
          label: 公告内容
          value: "一款 Terminal 风格的 Halo 主题."
        - $formkit: checkbox
          name: show_sns
          label: 展示社交资料
          value: true
        - $formkit: checkbox
          name: show_pin
          label: 置顶文章显示 pin 图标
          value: true
        - $formkit: select
          name: pin_pos
          label: pin 图标显示位置
          options:
            - label: "left"
              value: "pin-left"
            - label: "above"
              value: "pin-above"
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: true

    - group: post_page
      label: 文章页
      formSchema:
        - $formkit: checkbox
          name: show_toc
          label: 显示文章目录
          value: true
        - $formkit: select
          name: toc_default_open
          label: 文章目录默认状态
          value: "auto"
          help: 自动模式会在普通布局默认展开, 全屏布局默认收起
          options:
            - label: "自动"
              value: "auto"
            - label: "默认展开"
              value: "open"
            - label: "默认收起"
              value: "closed"
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: true

    - group: archives_page
      label: 归档页
      formSchema:
        - $formkit: text
          name: title
          label: 归档页标题自定义
          value:
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: false
        - $formkit: checkbox
          name: pagination
          label: 是否分页
          value: true
        - $formkit: select
          name: collapsible
          label: 展开模式
          value: "open"
          options:
            - label: "只展开第一项"
              value: "first"
            - label: "全部展开"
              value: "open"
            - label: "全部收起"
              value: "close"

    - group: categories_page
      label: 分类页
      formSchema:
        - $formkit: text
          name: title_s
          label: 分类页(复数) 标题自定义
          value:
        - $formkit: text
          name: title
          label: 分类页标题自定义
          value:

    - group: tags_page
      label: 标签页
      formSchema:
        - $formkit: text
          name: title_s
          label: 标签页(复数) 标题自定义
          value:
        - $formkit: text
          name: title
          label: 标签页标题自定义
          value:

    - group: links_page
      label: 友链页
      formSchema:
        - $formkit: text
          name: title
          label: 友链页标题自定义
          value:

    - group: sns
      label: 社交资料
      formSchema:
        - $formkit: checkbox
          name: rss
          label: RSS
          value: false
          
        - $formkit: array
          name: social_media
          label: 社交媒体
          value: [ ]
          itemLabels:
            - type: "iconify"
              label: "$value.iconify"
            - type: "text"
              label: "$value.name"
            - type: "text"
              label: "$value.url"
          children:
            - $formkit: iconify
              name: iconify
              label: 图标
              format: svg
              validation: "required"
            - $formkit: iconify
              name: pixel_iconify
              label: 像素风格图标
              format: svg
              help: "留空时使用普通图标"
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"

    - group: icp
      label: 备案
      formSchema:
        - $formkit: text
          name: icp_text
          label: ICP备案号
        - $formkit: text
          name: icp_link
          label: ICP备案跳转链接
          value: https://beian.miit.gov.cn/
        - $formkit: text
          name: filing_text
          label: 公安备案号
        - $formkit: text
          name: filing_link
          label: 公安备案跳转链接
          value: https://www.beian.gov.cn/
