apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-terminal-ez-setting
spec:
  forms:
    - group: general
      label: 通用设置
      formSchema:
        - $formkit: select
          name: time_style
          id: time_style
          label: 时间格式
          value: "yyyy-MM-dd"
          help: 控制文章发布时间的显示格式
          options:
            - label: "yyyy-MM-ddTHH:mm:ssXXX"
              value: "yyyy-MM-dd''T''HH:mm:ssXXX"
            - label: "yyyy-MM-dd HH:mm:ss"
              value: "yyyy-MM-dd'' ''HH:mm:ss"
            - label: "yyyy-MM-dd"
              value: "yyyy-MM-dd"
            - label: "custom"
              value: "custom"
        - $formkit: text
          if: "$get(time_style).value === 'custom'"
          key: custom-time-style
          name: custom_time_style
          label: 自定义时间格式
          placeholder: "yyyy-MM-dd"
          validation: "required"
        - $formkit: number
          name: prefer_ttl
          label: 访客偏好有效期 (小时)
          value: 24
          min: 0
          validation: "number|min:0"
          help: 访客手动选择的模式, 配色和像素风格过期后会在下次访问时恢复默认值, 设为 0 表示永久保存
        - $formkit: checkbox
          name: pjax_enable
          label: 启用 PJAX
          help: 开启后点击站内链接时只更新主要内容区域而不是整个页面 (可能与一些插件存在兼容问题)
          value: false
    - group: header
      label: 页头
      formSchema:
        - $formkit: text
          label: logo
          name: logo
          value:
          help: 设置左上角 logo 文本, 不设置默认为 halo 中设置的站点标题
        - $formkit: array
          name: buttons
          label: 功能按钮
          value:
            - value: search
            - value: color_scheme
            - value: appearance
            - value: pixel_style
          help: 数组顺序即页头按钮顺序; 内置按钮每种建议只添加一次
          itemLabels:
            - type: "text"
              if: "$value.value !== 'custom'"
              label: "$value.value"
            - type: "text"
              if: "$value.value === 'custom'"
              label: "$value.options.name"
          children:
            - $formkit: select
              name: value
              label: 按钮
              validation: "required"
              options:
                - label: 搜索
                  value: search
                - label: 配色切换
                  value: color_scheme
                - label: 外观切换
                  value: appearance
                - label: 像素化
                  value: pixel_style
                - label: 自定义功能
                  value: custom
            - $formkit: group
              if: "$value.value !== 'custom'"
              name: options
              key: standard-button-options
              label: 图标选项
              children:
                - $formkit: iconify
                  name: iconify
                  label: 图标
                  format: svg
                  help: 留空时使用主题内置图标
                - $formkit: iconify
                  name: pixel_iconify
                  label: 像素风格图标
                  format: svg
                  help: 留空时优先使用自定义普通图标, 否则使用主题内置像素图标
            - $formkit: group
              if: "$value.value === appearance"
              name: options
              key: appearance-button-options
              label: 外观切换
              children:
                - $formkit: iconify
                  name: light_iconify
                  label: 浅色模式图标
                  format: svg
                  help: 留空时使用主题内置图标
                - $formkit: iconify
                  name: light_pixel_iconify
                  label: 浅色模式像素风格图标
                  format: svg
                  help: 留空时优先使用自定义普通图标, 否则使用主题内置像素图标
                - $formkit: iconify
                  name: dark_iconify
                  label: 深色模式图标
                  format: svg
                  help: 留空时使用主题内置图标
                - $formkit: iconify
                  name: dark_pixel_iconify
                  label: 深色模式像素风格图标
                  format: svg
                  help: 留空时优先使用自定义普通图标, 否则使用主题内置像素图标
                - $formkit: iconify
                  name: system_iconify
                  label: 跟随系统模式图标
                  format: svg
                  help: 留空时使用主题内置图标
                - $formkit: iconify
                  name: system_pixel_iconify
                  label: 跟随系统模式像素风格图标
                  format: svg
                  help: 留空时优先使用自定义普通图标, 否则使用主题内置像素图标
            - $formkit: group
              if: "$value.value === custom"
              name: options
              key: custom-button-options
              label: 自定义功能按钮选项
              children:
                - $formkit: text
                  name: name
                  label: 按钮名称
                  validation: "required:trim|length:1,64"
                  help: 用于按钮的无障碍名称和鼠标提示
                - $formkit: code
                  name: onclick
                  label: onclick
                  language: js
                  validation: "required:trim"
                  help: 点击按钮时执行的 JavaScript, 可使用 event 和 this
                - $formkit: iconify
                  name: iconify
                  label: 图标
                  format: svg
                  validation: "required"
                - $formkit: iconify
                  name: pixel_iconify
                  label: 像素风格图标
                  format: svg
                  help: 留空时使用普通图标
    - group: typography
      label: 字体与排版
      formSchema:
        - $formkit: select
          label: 默认字体
          name: default_font
          value: "JetBrains Mono"
          options:
            - label: "系统默认"
              value: "system-ui"
            - label: "JetBrains Mono"
              value: "JetBrains Mono"
            - label: "Hack"
              value: "Hack"
            - label: "Fira Code"
              value: "Fira Code"
        - $formkit: checkbox
          name: custom_font_enable
          id: custom_font_enable
          label: 启用自定义字体
          value: false
          help: 可以添加多个字体, 优先级从上到下组成 fallback
        - $formkit: array
          if: "$get(custom_font_enable).value === true"
          key: custom-fonts
          name: custom_fonts
          label: 自定义字体
          value: [ ]
          itemLabels:
            - type: "text"
              label: "$value.family_name"
            - type: "text"
              label: "$value.file"
          children:
            - $formkit: text
              name: family_name
              label: 字体名称
              placeholder: "JetBrains Mono"
              validation: "required:trim|length:1,64"
            - $formkit: text
              name: postscript_name
              label: PostScript Name
              placeholder: "JetBrainsMono-Regular"
              validation: "length:0,64"
              help: "用于匹配系统中已安装的本地字体"
            - $formkit: attachment
              name: file
              label: 自定义字体文件
              value: ""
              validation: "required"
              help: "可以上传附件或直接填 URL"
            - $formkit: select
              name: format
              label: 字体格式
              value: woff2
              options:
                - label: WOFF2
                  value: woff2
                - label: WOFF
                  value: woff
                - label: TrueType
                  value: truetype
                - label: OpenType
                  value: opentype
            - $formkit: checkbox
              name: advanced
              label: 高级设置
              value: false
              help: "等同于直接写 css. 参考文档: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@font-face"
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-weight
              name: weight
              label: 字重
              value: "400"
            - $formkit: select
              if: "$value.advanced === true"
              key: custom-font-style
              name: style
              label: 字体样式
              value: normal
              options:
                - label: Auto
                  value: auto
                - label: Normal
                  value: normal
                - label: Italic
                  value: italic
                - label: Oblique
                  value: oblique
                - label: Left
                  value: left
                - label: Right
                  value: right
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-unicode-range
              name: unicode_range
              label: Unicode 范围
              value: ""
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-width
              name: width
              label: 字体宽度
              value: "auto"
            - $formkit: select
              if: "$value.advanced === true"
              key: custom-font-display
              name: display
              label: 字体显示策略
              value: swap
              options:
                - label: Auto
                  value: auto
                - label: Block
                  value: block
                - label: Swap
                  value: swap
                - label: Fallback
                  value: fallback
                - label: Optional
                  value: optional
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-feature-settings
              name: feature_settings
              label: OpenType 特性
              value: "normal"
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-variation-settings
              name: variation_settings
              label: 可变字体轴
              value: "normal"
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-size-adjust
              name: size_adjust
              label: 字体尺寸调整
              value: "100%"
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-ascent-override
              name: ascent_override
              label: 上升高度覆盖
              value: "normal"
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-descent-override
              name: descent_override
              label: 下降高度覆盖
              value: "normal"
            - $formkit: text
              if: "$value.advanced === true"
              key: custom-font-line-gap-override
              name: line_gap_override
              label: 行间隙覆盖
              value: "normal"
        - $formkit: text
          label: 基础字体大小
          name: font_size
          value:
          placeholder: "1rem"
          help: 控制全站基础字体大小, 例如 16px / 1rem / 18px
        - $formkit: text
          label: 基础行高
          name: line_height
          value:
          placeholder: "calc(var(--size-theme-font) * 1.8)"
          help: 控制全站基础行高, 例如 1.8 / 28px / calc(var(--size-theme-font) * 1.8)
        - $formkit: text
          label: 文章段落间距
          name: post_paragraph_spacing
          value:
          placeholder: "calc(var(--size-theme-font) * 1.5625)"
          help: 控制文章正文段落的上下间距, 例如 1.5rem / 24px / calc(var(--size-theme-font) * 1.5)
    - group: layout
      label: 布局
      formSchema:
        - $formkit: checkbox
          label: 启用全屏布局
          name: fullscreen_layout
          value: false
          help: 开启后让正文区域占满可用宽度
        - $formkit: checkbox
          label: 表格宽度铺满父元素
          name: table_full_width
          value: false
          help: 开启后文章内容中的 table 会占满正文内容区域宽度
        - $formkit: text
          label: 正文区域最大宽度
          name: max_width
          value:
          help: 控制正文区域最大宽度, 例如 960px / 80vw
        - $formkit: text
          label: 正文区域内边距
          name: content_padding
          value:
          placeholder: "calc(var(--size-theme-font) * 2.5)"
          help: 控制正文容器内边距, 例如 2rem / 24px / calc(var(--size-theme-font) * 2)
        - $formkit: text
          label: 正文媒体最大宽度
          name: media_max_width
          value:
          placeholder: "60%"
          help: 控制文章内容中图片 / 视频 / figure 的最大宽度
    - group: color_scheme
      label: 配色
      formSchema:
        - $formkit: select
          name: default_appearance
          label: 默认外观
          value: "system"
          help: 控制访客首次访问时使用的外观模式
          options:
            - label: "跟随系统"
              value: "system"
            - label: "浅色"
              value: "light"
            - label: "深色"
              value: "dark"
        - $formkit: select
          name: light_color_scheme
          id: light_color_scheme
          label: 浅色方案
          value: "day"
          help: 控制浅色模式使用的配色方案
          options:
            - label: "custom"
              value: "custom"
            - label: "day"
              value: "day"
            - label: "night"
              value: "night"
            - label: "blood"
              value: "blood"
            - label: "niello"
              value: "niello"
            - label: "matrix"
              value: "matrix"
            - label: "ink"
              value: "ink"
            - label: "paper"
              value: "paper"
            - label: "hopbush"
              value: "hopbush"
            - label: "pistachio"
              value: "pistachio"
            - label: "blue"
              value: "blue"
            - label: "studio"
              value: "studio"
            - label: "vanilla"
              value: "vanilla"
        - $formkit: text
          name: custom_light_scheme
          if: "$get(light_color_scheme).value === 'custom'"
          key: custom-light-scheme
          label: 自定义浅色配色
          help: 填写下方自定义配色的 ID
          validation: "required:trim|length:1,32|matches:/^[a-z0-9][a-z0-9_-]*$/"
        - $formkit: select
          name: dark_color_scheme
          id: dark_color_scheme
          label: 深色方案
          value: "night"
          help: 控制深色模式使用的配色方案
          options:
            - label: "custom"
              value: "custom"
            - label: "day"
              value: "day"
            - label: "night"
              value: "night"
            - label: "blood"
              value: "blood"
            - label: "niello"
              value: "niello"
            - label: "matrix"
              value: "matrix"
            - label: "ink"
              value: "ink"
            - label: "paper"
              value: "paper"
            - label: "hopbush"
              value: "hopbush"
            - label: "pistachio"
              value: "pistachio"
            - label: "blue"
              value: "blue"
            - label: "studio"
              value: "studio"
            - label: "vanilla"
              value: "vanilla"
        - $formkit: text
          name: custom_dark_scheme
          if: "$get(dark_color_scheme).value === 'custom'"
          key: custom-dark-scheme
          label: 自定义深色配色
          help: 填写下方自定义配色的 ID
          validation: "required:trim|length:1,32|matches:/^[a-z0-9][a-z0-9_-]*$/"
        - $formkit: array
          name: custom_color_schemes
          label: 自定义方案
          value: [ ]
          itemLabels:
            - type: "text"
              label: "$value.id"
          children:
            - $formkit: text
              name: id
              label: 配色 ID
              validation: "required:trim|length:1,32|matches:/^[a-z0-9][a-z0-9_-]*$/|not:custom,day,night,blood,niello,matrix,ink,paper,hopbush,pistachio,blue,studio,vanilla"
            - $formkit: color
              name: background
              label: 背景色
              validation: "required"
            - $formkit: color
              name: text
              label: 主文本色
              validation: "required"
            - $formkit: color
              name: accent
              label: 基础强调色
              validation: "required"
            - $formkit: checkbox
              name: advanced
              label: 高级颜色设置
              value: false
              help: 开启后可以基于基础色单独设置文字, 导航, 控件, 边框和代码等语义颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-text-secondary
              name: text_secondary
              label: 辅助文本色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-text-muted
              name: text_muted
              label: 弱化文字颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-text-inverse
              name: text_inverse
              label: 反色文字颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-text-accent
              name: text_accent
              label: 强调文字颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-text-label
              name: text_label
              label: 标签文字颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-text-link
              name: text_link
              label: 链接文字颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-navigation
              name: navigation
              label: 导航颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-control
              name: control
              label: 控件颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-border
              name: border
              label: 默认边框颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-border-accent
              name: border_accent
              label: 交互边框颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-border-emphasis
              name: border_emphasis
              label: 强调边框颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-selection
              name: selection
              label: 选中文本背景色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-caret
              name: caret
              label: 动态光标颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-code-text
              name: code_text
              label: 代码文字颜色
            - $formkit: color
              if: "$value.advanced === true"
              key: scheme-code-background
              name: code_background
              label: 代码背景颜色
    - group: global_style
      label: 全局样式
      formSchema:
        - $formkit: checkbox
          name: pixel_style
          label: 默认像素化风格
          value: false
          help: 开启后将默认使用像素风格字体及图标
        - $formkit: text
          label: 无序列表标记
          name: list_style
          value: ""
          placeholder: "disc"
          help: 等同 list-style
        - $formkit: select
          label: 边线样式
          name: border_style
          value: ""
          help: 控制主题通用边线样式
          options:
            - label: "default"
              value: ""
            - label: "solid"
              value: "solid"
            - label: "dashed"
              value: "dashed"
            - label: "dotted"
              value: "dotted"
            - label: "double"
              value: "double"
            - label: "none"
              value: "none"
        - $formkit: text
          label: 边线宽度
          name: border_width
          value:
          placeholder: "calc(var(--size-theme-font) * 0.125)"
          help: 控制主题通用边线宽度
        - $formkit: select
          label: 表格边线样式
          name: table_border_style
          value: ""
          help: 控制表格边线样式
          options:
            - label: "default"
              value: ""
            - label: "solid"
              value: "solid"
            - label: "dashed"
              value: "dashed"
            - label: "dotted"
              value: "dotted"
            - label: "double"
              value: "double"
            - label: "none"
              value: "none"
        - $formkit: text
          label: 表格边线宽度
          name: table_border_width
          value:
          placeholder: "calc(var(--size-theme-font) * 0.0625)"
          help: 控制表格边线宽度
        - $formkit: select
          label: 标题分隔线样式
          name: title_divider_style
          value: ""
          help: 控制文章标题分隔线样式
          options:
            - label: "default"
              value: ""
            - label: "solid"
              value: "solid"
            - label: "dashed"
              value: "dashed"
            - label: "dotted"
              value: "dotted"
            - label: "double"
              value: "double"
            - label: "none"
              value: "none"
        - $formkit: text
          label: 元信息分隔符
          name: post_meta_divider
          value:
          placeholder: "::"
          help: "控制文章元信息之间的分隔符, 例如 ::, |, ·"
    - group: sns
      label: 社交资料
      formSchema:
        - $formkit: checkbox
          name: rss
          label: RSS
          value: false
        - $formkit: array
          name: social_media
          label: 社交媒体
          value: [ ]
          itemLabels:
            - type: "iconify"
              label: "$value.iconify"
            - type: "text"
              label: "$value.name"
            - type: "text"
              label: "$value.url"
          children:
            - $formkit: iconify
              name: iconify
              label: 图标
              format: svg
              validation: "required"
            - $formkit: iconify
              name: pixel_iconify
              label: 像素风格图标
              format: svg
              help: "留空时使用普通图标"
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation:
                - - required
                - - matches
                  - "/^https?:\\/\\/\\S+$/"
                  - "/^mailto:\\S+$/"
                  - "/^tel:\\+?[0-9(). -]+$/"
    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: code
          name: custom
          label: 自定义 CSS
          language: css
          height: 150px
          value: ""
          help: 填写自定义 CSS, 内容会覆盖主题默认样式
    - group: index_page
      label: 首页
      formSchema:
        - $formkit: text
          name: notice_title
          label: 公告标题
          value: "Hello Terminal!"
        - $formkit: textarea
          name: notice_content
          label: 公告内容
          value: "一款 Terminal 风格的 Halo 主题."
          help: 支持 HTML, 请仅填写可信内容
        - $formkit: checkbox
          name: show_sns
          label: 展示社交资料
          value: true
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: true
        - $formkit: checkbox
          name: show_pin
          id: show_pin
          label: 置顶文章显示 pin 图标
          value: true
        - $formkit: select
          if: "$get(show_pin).value === true"
          key: pin-position
          name: pin_pos
          label: pin 图标显示位置
          value: "left"
          options:
            - label: "left"
              value: "left"
            - label: "above"
              value: "above"
    - group: post_page
      label: 文章页
      formSchema:
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: true
        - $formkit: checkbox
          name: show_toc
          id: show_toc
